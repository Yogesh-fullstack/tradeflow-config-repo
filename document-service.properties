spring.datasource.url=jdbc:postgresql://localhost:5433/document_db
spring.datasource.username=postgres
spring.datasource.password=Newstart@1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8082
logging.level.org.hibernate.SQL=DEBUG
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

custom.message=Document Service V1
my.name=Yogesh

# ==========================
# File Upload Configuration
# ==========================
file.upload-dir=uploads

#############################################################
# Resilience4j Circuit Breaker
#############################################################

resilience4j.circuitbreaker.instances.shippingService.register-health-indicator=true
resilience4j.circuitbreaker.instances.shippingService.sliding-window-size=10
resilience4j.circuitbreaker.instances.shippingService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.shippingService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.shippingService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.shippingService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.shippingService.automatic-transition-from-open-to-half-open-enabled=true

#############################################################
# Retry
#############################################################

resilience4j.retry.instances.shippingService.max-attempts=3
resilience4j.retry.instances.shippingService.wait-duration=2s

#############################################################
# Time Limiter
#############################################################

resilience4j.timelimiter.instances.shippingService.timeout-duration=5s

#############################################################
# Actuator
#############################################################

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents

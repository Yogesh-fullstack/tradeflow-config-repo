spring.datasource.url=jdbc:postgresql://localhost:5433/shipment_db
spring.datasource.username=postgres
spring.datasource.password= Newstart@1234

spring.application.name=shipping-service

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
custom.message=Hello V1

my.name=BusRefreshWorking

resilience4j.circuitbreaker.instances.notificationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notificationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationService.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.notificationService.permitted-number-of-calls-in-half-open-state=3
spring.aop.proxy-target-class=true

resilience4j.ratelimiter.instances.notificationService.limit-for-period=2
resilience4j.ratelimiter.instances.notificationService.limit-refresh-period=10s
resilience4j.ratelimiter.instances.notificationService.timeout-duration=0

# ===============================
# Kafka Configuration
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Topic Name
shipment.kafka.topic=shipment-created



resilience4j.retry.instances.notificationService.max-attempts=3
resilience4j.retry.instances.notificationService.wait-duration=2s
resilience4j.retry.instances.notificationService.enable-exponential-backoff=true
resilience4j.retry.instances.notificationService.exponential-backoff-multiplier=2


# ==========================================
# Micrometer Tracing
# ==========================================

management.tracing.enabled=true

management.tracing.sampling.probability=1.0

management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

management.otlp.tracing.transport=http

management.tracing.baggage.remote-fields=X-Correlation-ID

management.tracing.baggage.correlation.fields=X-Correlation-ID
